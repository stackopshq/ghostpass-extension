name: Safari

# Build/validation Safari : nécessite un runner macOS (Xcode).
#
# L'instance Gitea n'en héberge aucun aujourd'hui (le seul runner porte les labels
# `ubuntu-latest`, `ubuntu-22.04`, `ubuntu-20.04` et `host`). Un déclenchement automatique
# laisserait donc un run en `queued` indéfiniment à chaque push sur main, ce qui est
# précisément arrivé au run 1795. Le workflow reste donc **manuel uniquement**, jusqu'à ce
# qu'un runner macOS soit enregistré.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: safari-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Convert & build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://git.stackops.ch/api/packages/stackops/npm/"
          scope: "@stackops"
          cache: npm
      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build web extension (dist/)
        run: npm run build
      - name: Convert to a Safari Web Extension app
        run: |
          xcrun safari-web-extension-converter dist \
            --project-location safari \
            --app-name GhostPass \
            --bundle-identifier hq.stackops.ghostpass \
            --swift --no-open --force
      - name: Build the Safari app extension (macOS, no signing)
        run: |
          set -euo pipefail
          PROJ=$(find safari -maxdepth 3 -name '*.xcodeproj' | head -1)
          echo "Xcode project: $PROJ"
          xcodebuild -list -project "$PROJ"
          # Le convertisseur génère deux schémas ("… (macOS)" et "… (iOS)") : on compile le macOS.
          SCHEME=$(xcodebuild -list -project "$PROJ" \
            | awk '/Schemes:/{f=1;next} f&&NF{sub(/^[ \t]+/,"");print}' \
            | grep -i 'macos' | head -1)
          [ -n "$SCHEME" ] || SCHEME=$(xcodebuild -list -project "$PROJ" \
            | awk '/Schemes:/{f=1;next} f&&NF{sub(/^[ \t]+/,"");print;exit}')
          echo "Building scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
